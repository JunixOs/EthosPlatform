sonar.projectKey=com.ethos.platform
sonar.projectName=EthosPlatform
sonar.projectVersion=1.0.0

# Código fuente analizado (no incluye tests/, dist/, coverage/, node_modules/)
sonar.sources=apps/backend/src,apps/frontend/src
sonar.tests=apps/backend/tests,apps/frontend/tests

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.spec.tsx,apps/backend/src/datos/presistence/migrations/**
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx

# Reportes de cobertura generados por `pnpm test:coverage` (provider v8, reporter lcov)
sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info,apps/frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/backend/coverage/lcov.info,apps/frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
