name: Deploy Development

env:
  NODE_VERSION: 22
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_PROJECT_SUFFIX: .dev

on:
  push:
    branches:
      - develop

concurrency:
  group: development-deploy
  cancel-in-progress: true

jobs:

  analysis:
    name: Build & Quality Analysis
    runs-on: self-hosted
    environment: development-env
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Build Backend
        run: pnpm build:backend

      - name: Build Frontend
        run: pnpm build:frontend

      - name: Sonar Backend Analysis
        working-directory: apps/backend
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        run: |
          sonar-scanner \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.projectKey="com.ethos.backend${SONAR_PROJECT_SUFFIX}" \
            -Dsonar.projectName="EthosPlatform Backend (Development)" \
            -Dsonar.qualitygate.wait=false

      - name: Sonar Frontend Analysis
        working-directory: apps/frontend
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        run: |
          sonar-scanner \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.projectKey="com.ethos.frontend${SONAR_PROJECT_SUFFIX}" \
            -Dsonar.projectName="EthosPlatform Frontend (Development)" \
            -Dsonar.qualitygate.wait=false

  deploy:
    name: Deploy via Dockploy
    environment: development-env
    needs: analysis
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Trigger Dockploy Webhook
        env:
          DOCKPLOY_WEBHOOK: ${{ secrets.DOCKPLOY_WEBHOOK_DEV }}
        run: |
          if [ -z "$DOCKPLOY_WEBHOOK" ]; then
            echo "Error: DOCKPLOY_WEBHOOK_DEV secret is not configured." >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: deploy-from-github" \
            -d '{"ref": "refs/heads/develop", "environment": "development"}' \
            "$DOCKPLOY_WEBHOOK"
          echo "Development deploy webhook triggered successfully."